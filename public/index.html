<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아발론 온라인 V2</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header><b>⚔ THE <span>AVALON</span> ROOM</b><span id="room"></span></header><main id="root"></main></div><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script>
const ioClient=io();let S=null, roles=[];
const R=[["merlin","멀린","merlin-large.png"],["percival","퍼시벌","percival.png"],["loyal","충신","loyal-1.png"],["assassin","암살자","assassin.png"],["morgana","모르가나","morgana.png"],["oberon","오베론","oberon.png"],["mordred","모드레드","mordred.png"]];
const rn=Object.fromEntries(R.map(x=>[x[0],x[1]]));
ioClient.on("state",s=>{S=s;render()});ioClient.on("err",x=>{toast(x)});function toast(x){const e=document.querySelector("#toast");e.textContent=x;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function e(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function emit(x,d){ioClient.emit(x,d)}
function render(){document.querySelector("#room").textContent=S?`방 ${S.code}`:"";const q=document.querySelector("#root");if(!S){q.innerHTML=`<section class="hero card"><div class="eyebrow">ONLINE SOCIAL DEDUCTION</div><h1>아발론 온라인</h1><p>시간 제한 없이 친구들과 원정대를 꾸리고, 방장이 모든 단계를 진행합니다.</p><div class="row center"><input id="n" placeholder="닉네임" maxlength="16"><button class="gold" onclick="create()">방 만들기</button></div><div class="row center"><input id="c" placeholder="방 코드" maxlength="5"><button onclick="join()">방 참가</button></div></section>`;return}let x=`<div class="steps">${["준비","왕","원정대","투표","원정","결과"].map((a,i)=>`<i class="${i<=step()?'on':''}">${a}</i>`).join("")}</div>`;x+=S.phase==="lobby"?lobby():S.phase==="kingPick"?kingPick():S.phase==="team"?team():S.phase==="vote"?vote():S.phase==="quest"?quest():S.phase==="roundEnd"?roundEnd():S.phase==="assassination"?assassin():over();q.innerHTML=x}
function step(){return {lobby:0,kingPick:1,team:2,vote:3,quest:4,roundEnd:5,assassination:5,over:5}[S.phase]}
function secret(){const m=S.me;if(!m?.meta)return"";return `<section class="card secret"><img src="/assets/${m.meta.img}"><div><div class="eyebrow">MY SECRET ROLE</div><h2>${m.meta.n}</h2><span class="pill">${m.meta.s==="good"?"선의":"악의"}</span>${m.info?.length?`<h3>내가 알고 있는 정보</h3><div class="chips">${m.info.map(a=>`<span>${e(a.name)}${a.role?" · "+e(a.role):" · 정체 불명"}</span>`).join("")}</div>`:`<p class="muted">특별 공개 정보 없음</p>`}</div></section>`}
function lobby(){let host=S.host===S.me.id;return `<section class="card"><h2>게임 준비</h2><div class="players">${S.players.map(p=>`<div class="p"><b>${e(p.name)}</b>${p.id===S.host?'<small>방장</small>':''}</div>`).join("")}</div></section><section class="card"><h2>역할 구성 <small>${roles.length}/${S.players.length}</small></h2><p class="muted">카드를 눌러 역할을 원하는 만큼 추가하세요. 충신은 여러 장 선택할 수 있습니다.</p><div class="roles">${R.map(r=>`<button class="role ${roles.includes(r[0])?'picked':''}" onclick="${host?`pick('${r[0]}')`:''}"><img src="/assets/${r[2]}"><b>${r[1]}</b></button>`).join("")}</div>${host?`<div class="actions"><button class="gold" onclick="start()">역할 배정 & 게임 시작</button></div>`:""}</section>`}
function pick(r){if(roles.length>=S.players.length)return toast("인원수만큼 선택했어요.");roles.push(r);emit("setRoles",roles);render()}function create(){let n=document.querySelector("#n").value.trim()||"플레이어";emit("create",{name:n})}function join(){let n=document.querySelector("#n").value.trim()||"플레이어",c=document.querySelector("#c").value.trim();emit("join",{name:n,code:c})}function start(){emit("start")}
function kingPick(){return secret()+`<section class="card"><h2>👑 첫 번째 왕 선택</h2><p class="muted">${S.host===S.me.id?"방장이 첫 왕을 선택합니다.":"방장이 왕을 선택하는 중입니다."}</p><div class="players">${S.players.map(p=>`<button ${S.host===S.me.id?"":"disabled"} class="p big" onclick="emit('pickKing','${p.id}')">${e(p.name)}</button>`).join("")}</div></section>`}
function team(){let k=S.players.find(p=>p.id===S.players.find(x=>x.king)?.id),mine=k?.id===S.me.id;return secret()+`<section class="card"><div class="king"><b>👑 ${e(k?.name||"")} 왕</b><span>제 ${S.round+1}라운드 · ${S.team.length}/${S.teamSize}명</span></div><div class="players">${S.players.map(p=>`<button ${mine?"":"disabled"} class="p big ${S.team.includes(p.id)?"sel":""}" onclick="emit('toggleTeam','${p.id}')">${e(p.name)}${p.king?" 👑":""}</button>`).join("")}</div>${mine?`<div class="actions"><button class="gold" ${S.team.length!==S.teamSize?"disabled":""} onclick="emit('startVote')">원정대 확정 · 투표 시작</button></div>`:""}</section>`}
function vote(){let voted=S.votes.find(v=>v.id===S.me.id);return secret()+`<section class="card"><h2>🗳 원정대 승인</h2><div class="chips">${S.team.map(id=>`<span>${e(S.players.find(p=>p.id===id)?.name)}</span>`).join("")}</div><div class="actions"><button class="good" ${voted?"disabled":""} onclick="emit('vote','yes')">찬성</button><button class="bad" ${voted?"disabled":""} onclick="emit('vote','no')">반대</button></div><p class="muted center">${S.votes.length}/${S.players.length}명 투표 완료</p><div class="votes">${S.players.map(p=>{let v=S.votes.find(x=>x.id===p.id);return `<span>${e(p.name)} · ${v?(v.v==="yes"?"찬성":"반대"):"대기"}</span>`}).join("")}</div></section>`}
function quest(){let inTeam=S.team.includes(S.me.id),done=S.me._done;return secret()+`<section class="card center"><h2>⚔ 원정</h2><p class="muted">${inTeam?"원정 카드를 제출하세요.":"원정대가 카드를 제출하는 중입니다."}</p>${inTeam?`<div class="cards"><button class="mission success" onclick="emit('quest','success')">SUCCESS</button><button class="mission fail" onclick="emit('quest','fail')">FAIL</button></div>`:""}<p class="muted">${S.quests.length}/${S.team.length}명 제출 완료</p></section>`}
function roundEnd(){let m=S.missions[S.missions.length-1];return `<section class="card hero"><div class="eyebrow">ROUND ${m.round} COMPLETE</div><h1 class="${m.result==="성공"?"green":"red"}">${m.result}</h1><p>방장이 다음 라운드를 누르면 왕이 자동으로 다음 사람에게 넘어갑니다.</p>${S.host===S.me.id?`<button class="gold" onclick="emit('nextRound')">다음 라운드 · 다음 왕</button>`:"<span class='pill'>방장 대기 중</span>"}</section>${history()}`}
function assassin(){return secret()+`<section class="card"><h2>🗡 멀린 암살</h2><p class="muted">선의가 3번 성공했습니다. 암살자가 멀린이라고 생각하는 사람을 선택합니다.</p><div class="players">${S.players.map(p=>`<button class="p big" ${S.me.role==="assassin"?"":"disabled"} onclick="emit('assassinate','${p.id}')">${e(p.name)}</button>`).join("")}</div></section>`}
function over(){return `<section class="card hero"><div class="eyebrow">GAME OVER</div><h1>${S.win==="good"?"🏆 선의 진영 승리":"☠️ 악의 진영 승리"}</h1><p>${S.assassinTarget?"암살 결과까지 반영되었습니다.":"모든 승패 조건이 결정되었습니다."}</p><div class="players">${S.players.map(p=>`<div class="p"><b>${e(p.name)}</b><small>${rn[p.role]}</small></div>`).join("")}</div></section>${history()}`}
function history(){return `<section class="card"><h3>원정 기록</h3>${S.missions.map(m=>`<div class="hist"><span>${m.round}라운드</span><b>${m.result}</b><span>${m.team?.join(", ")||"원정대 거부"}</span></div>`).join("")}</section>`}
</script></body></html>
